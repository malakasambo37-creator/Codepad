name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail

          JAVA_VER_OUTPUT=$(java -version 2>&1) || {
            echo "::error::Failed to execute 'java -version'."
            exit 1
          }
          echo "$JAVA_VER_OUTPUT"
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          RAW_VERSION=$(printf '%s\n' "$JAVA_VER_OUTPUT" | awk -F '"' '/version/ {print $2; exit}')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if printf '%s' "$RAW_VERSION" | grep -q '^1\.'; then
            MAJOR_VERSION=$(printf '%s' "$RAW_VERSION" | cut -d'.' -f2)
          else
            MAJOR_VERSION=$(printf '%s' "$RAW_VERSION" | cut -d'.' -f1 | cut -d'-' -f1)
          fi

          case "$MAJOR_VERSION" in
            ''|*[!0-9]*)
              echo "::error::Could not parse a numeric Java major version from '$RAW_VERSION'."
              exit 1
              ;;
          esac

          echo "Detected active Java major version: ${MAJOR_VERSION}"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version (${MAJOR_VERSION}) is lower than the required Java 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail

          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Found existing ./debug.keystore; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found at ${KEYTOOL_BIN}."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary debug keystore at ./debug.keystore."
                exit 1
              }
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Temporary debug keystore ./debug.keystore does not exist or is empty."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK does not exist at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk was not found."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ -L "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path (${EXPECTED_APK}) does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK" | tr -d ' ')
          echo "Verified regular non-empty debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          set -euo pipefail

          VERIFIED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$VERIFIED_APK" ] || [ ! -s "$VERIFIED_APK" ]; then
            echo "::error::Verified APK is missing or empty at ${VERIFIED_APK}."
            exit 1
          fi

          REPO_RAW_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "$REPO_RAW_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")
          ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$VERIFIED_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release asset is missing or empty at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is unavailable. Skipping GitHub Release creation."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::warning::Prepared release asset does not exist or is empty. Aborting GitHub Release creation."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::warning::Prepared release asset is not a .apk file. Aborting GitHub Release creation."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")
          cat <<EOF > "$NOTES_FILE"
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **GitHub Actions Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Purpose:** Intended for testing only — this is **not** a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore generated on the CI runner.
          EOF

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest; then
            rm -f "$NOTES_FILE"
            echo "::warning::Failed to publish GitHub Release ${RELEASE_TAG}. The 'app-debug-apk' Actions artifact remains available."
            exit 1
          fi

          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -uo pipefail

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          EXPECTED_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          SAFE_ASSET_NAME="${ASSET_FILENAME:-}"

          RELEASE_URL=""
          CONFIRMED_TAG=""
          CONFIRMED_TITLE=""

          if [ "${PUBLISH_OUTCOME:-}" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null || true)
            CONFIRMED_TAG=$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' 2>/dev/null || true)
            CONFIRMED_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name' 2>/dev/null || true)
          fi

          if [ "${PUBLISH_OUTCOME:-}" = "success" ] && [ -n "$RELEASE_URL" ]; then
            echo "Release Tag: ${CONFIRMED_TAG:-$RELEASE_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE:-$EXPECTED_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${SAFE_ASSET_NAME}"
            echo "Download the APK directly from the release Assets section, or use the 'app-debug-apk' Actions artifact as a backup."

            {
              echo "## APK Download & Release Summary"
              echo ""
              echo "- **APK Build & Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **GitHub Release Publishing:** Succeeded (marked as Latest)"
              echo "- **Release Title:** ${CONFIRMED_TITLE:-$EXPECTED_TITLE}"
              echo "- **Release Tag:** \`${CONFIRMED_TAG:-$RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${SAFE_ASSET_NAME}\`"
              echo "- **GitHub Release URL:** ${RELEASE_URL}"
              echo ""
              echo "You can download \`${SAFE_ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or could not be verified. The APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            echo "APK Build Status: Succeeded"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "## APK Download & Release Summary"
              echo ""
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed. No release URL was published."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Actions Artifact Available:** \`app-debug-apk\`"
              echo ""
              echo "Download the built APK from the **Artifacts** section of this GitHub Actions workflow run (\`app-debug-apk\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
